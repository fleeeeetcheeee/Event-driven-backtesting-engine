[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evbt"
version = "0.1.0"
description = "Event-driven backtesting engine with realistic execution, costs, and risk constraints"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/evbt --cov-report=term-missing -v"

[tool.hatch.build.targets.wheel]
packages = ["src/evbt"]
